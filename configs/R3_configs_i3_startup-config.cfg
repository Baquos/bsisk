!

!
upgrade fpd auto
version 15.3
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R3
!
boot-start-marker
boot-end-marker
!
aqm-register-fnf
!
!
no aaa new-model
no ip icmp rate-limit unreachable
!
!
!
!
!
!
no ip domain lookup
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
!
redundancy
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
interface Ethernet0/0
 no ip address
 shutdown
 duplex auto
!
interface GigabitEthernet0/0
 ip address 10.34.0.1 255.255.255.252
 duplex full
 speed 1000
 media-type gbic
 negotiation auto
!
interface GigabitEthernet1/0
 ip address 10.13.0.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet2/0
 ip address 10.23.0.2 255.255.255.252
 negotiation auto
!
interface GigabitEthernet3/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet4/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet5/0
 no ip address
 shutdown
 negotiation auto
!
interface GigabitEthernet6/0
 no ip address
 negotiation auto
!
interface GigabitEthernet6/0.10
 encapsulation dot1Q 10
 ip address 192.168.10.2 255.255.255.0
 ip access-group ACL_ADM in
 standby 10 ip 192.168.10.254
 standby 10 preempt
!
interface GigabitEthernet6/0.20
 encapsulation dot1Q 20
 ip address 192.168.20.2 255.255.255.0
 ip access-group ACL_PC in
 standby 20 ip 192.168.20.254
 standby 20 preempt
!
router ospf 1
 router-id 0.0.0.3
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no passive-interface GigabitEthernet1/0
 no passive-interface GigabitEthernet2/0
 network 10.13.0.0 0.0.0.3 area 0.0.0.10
 network 10.23.0.0 0.0.0.3 area 0.0.0.10
 network 10.34.0.0 0.0.0.3 area 0.0.0.10
 network 192.168.10.0 0.0.0.255 area 0.0.0.10
 network 192.168.20.0 0.0.0.255 area 0.0.0.10
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
!
!
ip access-list extended ACL_ADM
 remark =================================================
 remark ====== ADM (192.168.10.0/24) ======
 permit ip 192.168.10.0 0.0.0.255 any
 remark ============= ICMP ADM <-> PC (ping) ============
 permit icmp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 echo
 permit icmp 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255 echo-reply
 remark =================================================
ip access-list extended ACL_PC
 remark ============= ICMP ADM <-> PC (ping) ============
 permit icmp 192.168.10.0 0.0.0.255 192.168.20.0 0.0.0.255 echo
 permit icmp 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255 echo-reply
 remark =================================================
 remark === PC (192.168.20.0/24) ===
 permit tcp 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255 eq www
 permit tcp 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255 eq 443
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq www
 permit tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 443
 permit tcp any 192.168.20.0 0.0.0.255 established
 permit udp 192.168.20.0 0.0.0.255 any eq domain
 permit udp any 192.168.20.0 0.0.0.255 eq domain
 deny   tcp 192.168.20.0 0.0.0.255 192.168.40.0 0.0.0.255 eq 22
 deny   ip 192.168.20.0 0.0.0.255 192.168.10.0 0.0.0.255
 deny   ip 192.168.20.0 0.0.0.255 192.168.50.0 0.0.0.255
 permit ip 192.168.20.0 0.0.0.255 any
 remark =================================================
!
no cdp log mismatch duplex
!
!
!
control-plane
!
!
mgcp behavior rsip-range tgcp-only
mgcp behavior comedia-role none
mgcp behavior comedia-check-media-src disable
mgcp behavior comedia-sdp-force disable
!
mgcp profile default
